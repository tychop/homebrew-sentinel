name: Update Formula

on:
  repository_dispatch:
    types: [update-formula]

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Formula
        run: |
          VERSION="${{ github.event.client_payload.version }}"
          SHA256="${{ github.event.client_payload.sha256 }}"
          DMG_FILE="${{ github.event.client_payload.dmg_file }}"

          echo "Updating formula to version $VERSION"
          echo "SHA256: $SHA256"
          echo "DMG: $DMG_FILE"

          # Update the formula using sed
          sed -i "s/version \".*\"/version \"$VERSION\"/" Casks/sentinel-app.rb
          sed -i "s/sha256 \".*\"/sha256 \"$SHA256\"/" Casks/sentinel-app.rb
          sed -i "s|url \"https://github.com/tychop/sentinel-releases/releases/download/v[^\"]*|url \"https://github.com/tychop/sentinel-releases/releases/download/v${VERSION}/${DMG_FILE}|" Casks/sentinel-app.rb

          # Show the changes
          git diff Casks/sentinel-app.rb

      - name: Commit and Push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add Casks/sentinel-app.rb
          git commit -m "Update to v${{ github.event.client_payload.version }}" || echo "No changes"
          git push
